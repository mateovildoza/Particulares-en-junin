<!-- SDK de Firebase y Lógica del Sistema de Reseñas -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3ZY3m-KiGs6BW3tTCdqw-aES24N0nP_k",
            authDomain: "particulares-en-junin.firebaseapp.com",
            projectId: "particulares-en-junin",
            storageBucket: "particulares-en-junin.firebasestorage.app",
            messagingSenderId: "99751846780",
            appId: "1:99751846780:web:e4be21e7c527cd72c7baf9",
            measurementId: "G-FYHELSC70E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioActual = null;

        function abrirModal(id) {
            document.getElementById(id).style.display = 'flex';
        }
        function cerrarModales() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }

        document.getElementById('cerrarModalLogin').addEventListener('click', cerrarModales);
        document.getElementById('cerrarModalRegistro').addEventListener('click', cerrarModales);
        document.getElementById('btnAbrirLoginResena').addEventListener('click', () => abrirModal('modalLogin'));

        onAuthStateChanged(auth, (user) => {
            const authBar = document.getElementById('authBar');
            usuarioActual = user;

            if (user) {
                const nombreMostrar = user.displayName || user.email;
                authBar.innerHTML = `
                    <span class="user-welcome">Hola, <strong>${escapeHTML(nombreMostrar)}</strong></span>
                    <button id="btnLogout" class="btn-auth-secundario">Cerrar Sesión</button>
                `;
                document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
                document.getElementById('bloqueFormResena').style.display = 'block';
                document.getElementById('bloqueLoginRequerido').style.display = 'none';
            } else {
                authBar.innerHTML = `
                    <button id="btnAbrirLogin" class="btn-auth-primario">Iniciar Sesión</button>
                    <button id="btnAbrirRegistro" class="btn-auth-secundario">Registrarse</button>
                `;
                document.getElementById('btnAbrirLogin').addEventListener('click', () => abrirModal('modalLogin'));
                document.getElementById('btnAbrirRegistro').addEventListener('click', () => abrirModal('modalRegistro'));
                document.getElementById('bloqueFormResena').style.display = 'none';
                document.getElementById('bloqueLoginRequerido').style.display = 'block';
            }
            cargarResenas();
        });

        async function cargarResenas() {
            const contenedor = document.getElementById('contenedorResenas');
            contenedor.innerHTML = "<p style='color: #666;'>Cargando opiniones...</p>";
            
            try {
                const q = query(collection(db, "resenas"), orderBy("fecha", "desc"));
                const querySnapshot = await getDocs(q);
                
                contenedor.innerHTML = "";
                
                if(querySnapshot.empty) {
                    contenedor.innerHTML = "<p style='color: #666;'>Todavía no hay reseñas. ¡Iniciá sesión y sé el primero!</p>";
                    return;
                }

                querySnapshot.forEach((documento) => {
                    const r = documento.data();
                    const docId = documento.id;
                    const numEstrellas = parseInt(r.estrellas) || 5;
                    const estrellasTexto = "★".repeat(numEstrellas) + "☆".repeat(5 - numEstrellas);

                    // Formatear la fecha de Firebase
                    let fechaTexto = "";
                    if (r.fecha && r.fecha.toDate) {
                        const fechaOpciones = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                        fechaTexto = r.fecha.toDate().toLocaleDateString('es-AR', fechaOpciones);
                    }

                    const esMiResena = usuarioActual && usuarioActual.uid === r.userId;

                    const tarjeta = document.createElement('div');
                    tarjeta.classList.add('tarjeta-resena');
                    tarjeta.innerHTML = `
                        <div class="tarjeta-header">
                            <div>
                                <div class="estrellas">${estrellasTexto}</div>
                                <span class="autor">${escapeHTML(r.nombre)} ${escapeHTML(r.apellido)}</span>
                                ${fechaTexto ? `<span style="font-size: 0.75rem; color: #888; display: block; margin-top: 2px;">${fechaTexto}</span>` : ''}
                            </div>
                            ${esMiResena ? `<button class="btn-eliminar" data-id="${docId}">🗑️ Borrar</button>` : ''}
                        </div>
                        <p class="comentario">${escapeHTML(r.comentario)}</p>
                    `;
                    contenedor.appendChild(tarjeta);
                });

                document.querySelectorAll('.btn-eliminar').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = this.getAttribute('data-id');
                        if (confirm("¿Querés borrar tu reseña?")) {
                            try {
                                await deleteDoc(doc(db, "resenas", id));
                                alert("Reseña eliminada.");
                                cargarResenas();
                            } catch(e) {
                                alert("Error al borrar la reseña.");
                            }
                        }
                    });
                });

            } catch (e) {
                contenedor.innerHTML = "<p style='color: #d9534f;'>Error al cargar las reseñas desde la nube.</p>";
            }
        }

        document.getElementById('formResena').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!usuarioActual) return;

            const btn = document.getElementById('btnEnviar');
            btn.textContent = "Publicando...";
            btn.disabled = true;

            const estrellas = document.getElementById('estrellas').value;
            const comentario = document.getElementById('comentario').value.trim();

            const partesNombre = (usuarioActual.displayName || "Alumno").split(" ");
            const nombre = partesNombre[0] || "Alumno";
            const apellido = partesNombre.slice(1).join(" ") || "";

            try {
                await addDoc(collection(db, "resenas"), {
                    userId: usuarioActual.uid,
                    nombre: nombre,
                    apellido: apellido,
                    estrellas: estrellas,
                    comentario: comentario,
                    fecha: serverTimestamp()
                });

                document.getElementById('comentario').value = "";
                alert('¡Reseña publicada con éxito en todos los dispositivos!');
                cargarResenas();
            } catch (e) {
                alert('Error al publicar reseña.');
            } finally {
                btn.textContent = "Publicar Reseña";
                btn.disabled = false;
            }
        });

        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value.trim();
            const apellido = document.getElementById('regApellido').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, {
                    displayName: `${nombre} ${apellido}`
                });
                cerrarModales();
                alert('¡Cuenta creada e sesión iniciada!');
            } catch (error) {
                alert('Error al crear cuenta: ' + error.message);
            }
        });

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                cerrarModales();
                alert('¡Sesión iniciada correctamente!');
            } catch (error) {
                alert('Email o contraseña incorrectos.');
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
